<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>MoneyZen - Gestion de Budget</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MoneyZen - Maîtrisez vos finances en toute sérénité. Plan de redressement, analyse intelligente et recommandations personnalisées.">
  <meta name="theme-color" content="#009688">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MoneyZen">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #00796b 0%, #004d40 100%);
      min-height: 100vh;
    }
    app-root {
      display: block;
      min-height: 100vh;
    }
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: white;
      background: linear-gradient(135deg, #00796b 0%, #004d40 100%);
    }
    .loading-screen h1 {
      font-size: 3.5rem;
      margin: 0 0 0.5rem 0;
      font-weight: 300;
      letter-spacing: 2px;
    }
    .loading-screen .tagline {
      font-size: 1.3rem;
      opacity: 0.9;
      font-weight: 300;
      margin-bottom: 2rem;
    }
    .loading-screen .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="mat-typography">
  <app-root>
    <div class="loading-screen">
      <h1>MoneyZen</h1>
      <p class="tagline">Maîtrisez vos finances en toute sérénité</p>
      <div class="spinner"></div>
    </div>
  </app-root>
</body>
</html>
