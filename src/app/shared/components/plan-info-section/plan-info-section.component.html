<div id="plan-info" class="info-section">
  <h3>
    <mat-icon>info</mat-icon>
    {{ title() }}
  </h3>

  <div class="info-cards">
    @for (card of infoCards(); track card.title) {
      <div class="info-card">
        <div class="card-icon">
          <mat-icon>{{ card.icon }}</mat-icon>
        </div>
        <div class="card-content">
          <h4>{{ card.title }}</h4>
          <p>{{ card.description }}</p>
        </div>
      </div>
    }
  </div>

  @if (showAlert()) {
    <div class="alert-box" [class]="'alert-' + alertIcon()">
      <mat-icon>{{ alertIcon() }}</mat-icon>
      <div>
        <strong>{{ alertTitle() }}</strong>
        <p>{{ alertMessage() }}</p>
      </div>
    </div>
  }
</div>
