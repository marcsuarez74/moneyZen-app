<div class="plan-layout">
  <!-- Navigation interne -->
  @if (showNavigation()) {
    <aside class="plan-navigation-sidebar">
      <app-plan-navigation [sections]="sections()"></app-plan-navigation>
    </aside>
  }

  <!-- Contenu principal -->
  <mat-card class="plan-card" [attr.data-plan-type]="planType()">
    <mat-card-header>
      <div [class]="headerClass" mat-card-avatar>
        <mat-icon>{{ icon() }}</mat-icon>
      </div>
      <mat-card-title>{{ title() }}</mat-card-title>
      <mat-card-subtitle>{{ subtitle() }}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <ng-content select="[cardContent]"></ng-content>
    </mat-card-content>

    <mat-card-actions align="end">
      <ng-content select="[cardActions]"></ng-content>
    </mat-card-actions>
  </mat-card>
</div>
