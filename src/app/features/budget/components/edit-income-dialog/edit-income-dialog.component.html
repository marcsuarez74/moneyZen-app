<h2 mat-dialog-title>Modifier mes revenus</h2>

<mat-dialog-content [formGroup]="incomeForm">
  <!-- Salaire -->
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Salaire mensuel net</mat-label>
    <input matInput type="number" formControlName="salary" placeholder="2500">
    <span matSuffix>€</span>
    <mat-hint>Votre revenu principal après impôts</mat-hint>
  </mat-form-field>

  <!-- Jour de paie -->
  <div class="field-row">
    <mat-form-field appearance="outline" class="payday-field">
      <mat-label>Jour de paie</mat-label>
      <input matInput type="number" formControlName="paydayDay" min="1" max="31">
      <span matSuffix>/mois</span>
      <mat-hint>Ex: 25 pour le 25 de chaque mois</mat-hint>
    </mat-form-field>

    <div class="payday-buttons">
      <button mat-icon-button (click)="decrementPayday()" [disabled]="incomeForm.get('paydayDay')?.value <= 1">
        <mat-icon>remove</mat-icon>
      </button>
      <button mat-icon-button (click)="incrementPayday()" [disabled]="incomeForm.get('paydayDay')?.value >= 31">
        <mat-icon>add</mat-icon>
      </button>
    </div>
  </div>

  <!-- Solde -->
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Solde bancaire actuel</mat-label>
    <input matInput type="number" formControlName="accountBalance" placeholder="0">
    <span matSuffix>€</span>
    <mat-hint [class.positive]="isPositiveBalance()" [class.negative]="!isPositiveBalance() && incomeForm.get('accountBalance')?.value !== 0">
      {{ balanceStatusText() }}
    </mat-hint>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Annuler</button>
  <button mat-raised-button color="primary" (click)="onSave()" [disabled]="!incomeForm.valid">
    Enregistrer
  </button>
</mat-dialog-actions>
