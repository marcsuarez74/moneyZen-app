<div class="fintech-dialog">
  <div class="dialog-header">
    <div class="header-bg"></div>
    <div class="header-content">
      <div class="header-icon">
        <mat-icon>edit</mat-icon>
      </div>
      <h2>Modifier mes revenus</h2>
    </div>
  </div>

  <mat-dialog-content [formGroup]="incomeForm">
    <div class="form-card">
      <!-- Salaire -->
      <div class="input-group">
        <label class="input-label">
          <mat-icon>payments</mat-icon>
          Revenus mensuels
        </label>
        <div class="input-wrapper">
          <input 
            type="number" 
            formControlName="salary" 
            placeholder="2500"
            class="fintech-input"
            [class.filled]="incomeForm.get('salary')?.value"
          >
          <span class="currency">€</span>
        </div>
        <span class="input-hint">Salaire net après impôts</span>
      </div>

      <!-- Jour de paie -->
      <div class="input-group">
        <label class="input-label">
          <mat-icon>calendar_today</mat-icon>
          Jour de paie
        </label>
        <div class="payday-selector">
          <button 
            mat-icon-button 
            class="counter-btn" 
            (click)="decrementPayday()"
            [disabled]="incomeForm.get('paydayDay')?.value <= 1"
          >
            <mat-icon>remove</mat-icon>
          </button>
          
          <div class="payday-display">
            <span class="day-number">{{ incomeForm.get('paydayDay')?.value }}</span>
            <span class="day-suffix">{{ incomeForm.get('paydayDay')?.value === 1 ? 'er' : '' }}</span>
          </div>
          
          <button 
            mat-icon-button 
            class="counter-btn" 
            (click)="incrementPayday()"
            [disabled]="incomeForm.get('paydayDay')?.value >= 31"
          >
            <mat-icon>add</mat-icon>
          </button>
        </div>
        <span class="input-hint">du mois</span>
      </div>

      <!-- Solde -->
      <div class="input-group">
        <label class="input-label">
          <mat-icon>account_balance_wallet</mat-icon>
          Solde bancaire
        </label>
        <div class="input-wrapper" [class.positive]="isPositiveBalance()" [class.negative]="!isPositiveBalance() && incomeForm.get('accountBalance')?.value !== 0">
          <input 
            type="number" 
            formControlName="accountBalance" 
            placeholder="0"
            class="fintech-input"
            [class.positive]="isPositiveBalance()"
            [class.negative]="!isPositiveBalance()"
          >
          <span class="currency">€</span>
        </div>
        <div class="balance-badge" [class.positive]="isPositiveBalance()" [class.negative]="!isPositiveBalance() && incomeForm.get('accountBalance')?.value !== 0">
          <mat-icon>{{ isPositiveBalance() ? 'trending_up' : 'trending_down' }}</mat-icon>
          {{ balanceStatusText() }}
        </div>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button mat-button class="btn-secondary" (click)="onCancel()">Annuler</button>
    <button mat-raised-button class="btn-primary" (click)="onSave()" [disabled]="!incomeForm.valid">
      <mat-icon>save</mat-icon>
      Enregistrer
    </button>
  </mat-dialog-actions>
</div>
