name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci --legacy-peer-deps
    
    - name: Run linter
      run: npm run lint
    
    - name: Build application
      run: npm run build -- --configuration=production --base-href=/moneyzen/
      
    - name: Verify build output
      run: |
        echo "Build output structure:"
        ls -la dist/
        if [ -d "dist/budget-app/browser" ]; then
          echo "✓ Build successful"
          ls -la dist/budget-app/browser/
        else
          echo "✗ Build output not found"
          exit 1
        fi

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci --legacy-peer-deps
    
    - name: Build for production
      run: npm run build -- --configuration=production --base-href=/moneyzen/
    
    - name: Prepare GitHub Pages structure
      run: |
        # Créer le dossier de déploiement
        mkdir -p deploy/app
        
        # Copier la landing page (docs/index.html)
        cp docs/index.html deploy/
        
        # Copier le build Angular dans le sous-dossier app/
        cp -r dist/budget-app/browser/* deploy/app/
        
        # Créer la page 404 pour le routing Angular
        cp deploy/app/index.html deploy/app/404.html
        
        # Vérifier la structure
        echo "Structure du déploiement :"
        ls -la deploy/
        echo "---"
        ls -la deploy/app/
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: deploy
    
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
