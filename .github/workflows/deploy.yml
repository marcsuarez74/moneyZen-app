name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular App
        run: npm run build -- --base-href /moneyzen/

      - name: Prepare GitHub Pages Structure
        run: |
          # Créer le dossier de déploiement
          mkdir -p deploy/app
          
          # Copier la landing page (docs/index.html)
          cp docs/index.html deploy/
          
          # Copier le build Angular dans le sous-dossier app/
          cp -r dist/budget-app/browser/* deploy/app/
          
          # Créer la page 404 pour le routing Angular
          cp deploy/app/index.html deploy/app/404.html
          
          # Vérifier la structure
          echo "Structure du déploiement :"
          ls -la deploy/
          echo "---"
          ls -la deploy/app/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
