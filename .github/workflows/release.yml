name: 🚀 Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write
  packages: write

jobs:
  # Vérifications pré-release
  validate:
    name: ✅ Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

      - name: Build application
        run: npm run build:prod

  # Création de la release
  release:
    name: 📝 Create Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build application
        run: npm run build:prod

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          CHANGELOG_CONTENT=$(awk "/^## \[$VERSION\]/{flag=1;next}/^## \[/{flag=0}flag" CHANGELOG.md)
          
          if [ -z "$CHANGELOG_CONTENT" ]; then
            CHANGELOG_CONTENT="Voir le [CHANGELOG.md](./CHANGELOG.md) pour les détails complets."
          fi
          
          # Escape newlines for GitHub Actions
          CHANGELOG_CONTENT="${CHANGELOG_CONTENT//'%'/'%25'}"
          CHANGELOG_CONTENT="${CHANGELOG_CONTENT//$'\n'/'%0A'}"
          CHANGELOG_CONTENT="${CHANGELOG_CONTENT//$'\r'/'%0D'}"
          
          echo "CONTENT=$CHANGELOG_CONTENT" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: 🚀 MoneyZen v${{ steps.get_version.outputs.VERSION }}
          body: |
            ## 🎉 Nouvelle version v${{ steps.get_version.outputs.VERSION }}

            ${{ steps.changelog.outputs.CONTENT }}

            ---

            ### 📦 Installation

            Cette application est une PWA (Progressive Web App) hébergée sur GitHub Pages.

            **🌐 Accès direct :** https://marcsuarez74.github.io/moneyZen-app/

            ### 💾 Téléchargements

            - 📱 **Application Web** : [Voir la démo en ligne](https://marcsuarez74.github.io/moneyZen-app/)
            - 📦 **Code source** : Disponible ci-dessous

            ### 📱 Fonctionnalités principales

            - 💰 Suivi budgétaire complet et intelligent
            - 📊 Analyse et recommandations personnalisées
            - 🎯 Plan de redressement pour découverts bancaires
            - 🏆 Gestion de projets d'épargne
            - 🔄 Calcul automatique du budget quotidien
            - 🔒 100% offline et confidentiel (données locales)

            ### 🛠️ Stack technique

            - Angular 19 (zoneless)
            - TypeScript 5.8+
            - Angular Material
            - NgRx Signals

            ### 📋 Exigences

            - Navigateur moderne (Chrome, Firefox, Safari, Edge)
            - JavaScript activé
            - LocalStorage disponible

            ---

            <sub>Release générée automatiquement le ${{ github.event.head_commit.timestamp }}</sub>
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

  # Note: Le déploiement est géré par ci-cd.yml automatiquement sur chaque push main
